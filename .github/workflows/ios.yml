name: iOS
on:
  push:
    branches: [main, master, 'ios-*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: go1.24.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build unsigned IPA
        run: |
          chmod +x tool/build-ios.sh
          tool/build-ios.sh config/build.community.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asterlink-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish to the ios-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One moving pre-release keeps a stable download page for the newest build.
          gh release delete ios-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create ios-latest build/ios/ipa/*.ipa --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "iOS 测试版（未签名）" \
            --notes "分支 ${GITHUB_REF_NAME}，提交 ${GITHUB_SHA::7}。未签名 IPA，请用自己的证书签名后安装。"
